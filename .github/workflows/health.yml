name: live-health

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wake Render and check endpoints
        run: |
          set -u
          URL="https://seamless-banking.onrender.com"
          code="000"
          for i in $(seq 1 15); do
            code=$(curl -s -o /tmp/health -w '%{http_code}' --max-time 60 "$URL/v1/health" || true)
            echo "attempt $i: HTTP $code"
            cat /tmp/health 2>/dev/null; echo
            [ "$code" = "200" ] && break
            sleep 8
          done
          if [ "$code" != "200" ]; then
            echo "health check failed" >&2
            exit 1
          fi
          for path in / /product.html /guide.html /m /research; do
            printf '%-14s ' "$path"
            curl -s -o /dev/null -w '%{http_code}\n' --max-time 60 "$URL$path"
          done
          echo "--- content markers ---"
          curl -s --max-time 60 "$URL/" -o /tmp/index.html
          for marker in 'scroll-top.js' '/product.html' 'guide-trigger' 'Как это работает'; do
            if grep -q "$marker" /tmp/index.html; then echo "index: OK  $marker"; else echo "index: OLD $marker"; fi
          done
          for asset in /scroll-top.js /product.html /v2.css /app.js; do
            code=$(curl -s -o /tmp/asset -w '%{http_code}' --max-time 60 "$URL$asset")
            printf '%-14s %s %s bytes\n' "$asset" "$code" "$(wc -c < /tmp/asset)"
          done
          echo "app.js version: $(curl -s --max-time 60 "$URL/app.js" | grep -o "2026\.11\.01" | head -1)"
          echo "v2.css guide rules: $(curl -s --max-time 60 "$URL/v2.css" | grep -c "guide-trigger")"
          echo "--- headers ---"
          curl -sI --max-time 60 "$URL/" | grep -iE 'etag|last-modified|age|cache-control|server|cf-cache-status' || true
          echo "health release: $(curl -s --max-time 60 "$URL/v1/health")"
          echo "--- metrics ---"
          curl -s --max-time 60 "$URL/v1/metrics" | head -c 400
